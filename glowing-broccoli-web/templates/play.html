<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Juego de Preguntas Financieras</title>
</head>
<body>
    <div class="container">
        <h1>Juego de Preguntas Financieras</h1>
        <div id="question-container">
            <h2 id="question"></h2>
            <div id="answer-buttons" class="btn-container">
                <button class="btn" onclick="selectAnswer(1)">Respuesta 1</button>
                <button class="btn" onclick="selectAnswer(2)">Respuesta 2</button>
                <button class="btn" onclick="selectAnswer(3)">Respuesta 3</button>
                <button class="btn" onclick="selectAnswer(4)">Respuesta 4</button>
            </div>
        </div>
        <div id="score-container" style="display: none;">
            <h2>Tu puntaje: <span id="score"></span></h2>
            <button onclick="restartGame()">Reiniciar Juego</button>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
