<style>
    @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    </style>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Menú principal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/menu.css') }}">
    <style>
        /* Puedes poner esto aquí o en tu CSS */
        .menu-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* espacio entre botones */
            margin-top: 30px;
            size: 40px;
        }

        .menu-buttons form {
            width: 500%;
            max-width: 200px; /* ancho máximo para mantenerlo centrado */
        }

        .menu-buttons button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button {
            transition: transform 0.3s ease-in-out;
        }

        button:hover {
        transform: scale(1.5);
        }

    </style>
</head>
<body>
    <div class="main">
        <h1>Menú Principal</h1>
        <h3>Selecciona una opción</h3>

        <div class="menu-buttons">
            <form action="{{ url_for('aventura') }}">
                <button type="submit">Aventura</button>
            </form>

            <form action="{{ url_for('pregunta') }}">
                <button type="submit">Práctica</button>
            </form>

            <form action="{{ url_for('scoreboard') }}">
                <button type="submit">Scoreboard</button>
            </form>
        </div>
    </div>
    <div class="corner-display">
    <p>Usuario: {{ user }}</p>
    <p>Puntaje: {{ score }}</p>
    </div>
</body>
</html>
