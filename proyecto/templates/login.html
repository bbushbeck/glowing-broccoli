<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>HTML LOGIN PRUEBA</title>
    <!-- Referencia al CSS en la carpeta static -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/prueba.css') }}">
</head>
<body>
    <div class="main">
        <h1>Login</h1>
        <h3>Introduce tus datos</h3>

        <form action="{{ url_for('login') }}" method="post">
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" name="usuario" placeholder="Introduzca su usuario" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Introduzca su contraseña" required>

            <div class="wrap">
                <button type="submit">Mandar</button>
            </div>
        </form>

        <p>¿No te has registrado?</p>
        <a href="#" style="text-decoration: none;">Crear una cuenta</a>
    </div>
</body>
</html>
